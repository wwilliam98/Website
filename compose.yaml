# Deploy: git pull && docker compose up -d --build && docker image prune -f
services:
  website:
    build: .
    restart: unless-stopped
    # Localhost only, for checks like curl localhost:3000; visitors come in through Caddy.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"   # one hop: Caddy
    volumes:
      - ./config.js:/app/config.js:ro
      - ./private:/app/private:ro
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - website
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates; keep this volume or Caddy re-issues them
      - caddy_config:/config
    networks:
      - default
      - web   # shared with other compose projects on this server (e.g. badminton-web)
    logging: *logging

networks:
  # Fixed name so other compose projects can join it with `external: true`.
  # This project creates it if it doesn't exist yet.
  web:
    name: web

volumes:
  caddy_data:
  caddy_config:
